<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <title>اتصال محدود · حديث القلوب</title>
    <style>
      :root { color-scheme: dark; font-family: "Cairo", system-ui, sans-serif; background: #121212; color: #f4ede7; }
      body { min-height: 100dvh; display: grid; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; background: radial-gradient(circle at 80% 10%, rgba(212, 165, 116, .13), transparent 35%), #121212; }
      main { width: min(100%, 520px); padding: clamp(26px, 7vw, 42px); border: 1px solid rgba(212, 165, 116, .25); border-radius: 24px; background: rgba(31, 29, 28, .95); box-shadow: 0 20px 55px rgba(0, 0, 0, .28); text-align: center; }
      .mark { display: inline-grid; width: 48px; height: 48px; place-items: center; border: 1px solid rgba(212, 165, 116, .48); border-radius: 50%; color: #d4a574; font-size: 1.5rem; }
      h1 { margin: 16px 0 8px; font-family: "Amiri", Georgia, serif; font-size: clamp(1.9rem, 8vw, 2.55rem); }
      p { margin: 0; color: #cdc3bd; line-height: 1.9; }
      a { display: inline-block; margin-top: 22px; padding: 11px 20px; border-radius: 999px; background: #d4a574; color: #221b17; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">♡</span>
      <h1>لا يوجد اتصال الآن</h1>
      <p>تحتاج بطاقات اللعبة والمحتوى المقترح والحساب إلى اتصال آمن بالإنترنت. أعد الاتصال ثم افتح حديث القلوب من جديد.</p>
      <a href="/">إعادة المحاولة</a>
    </main>
  </body>
</html>
